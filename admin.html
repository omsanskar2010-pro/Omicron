<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>OMICRON Backend Admin</title>
<style>
  body {
    background: #0a0a0f; color: #e5e5f0; font-family: system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 20px;
  }
  .card {
    background: #14141f; border: 1px solid #2a2a3a; border-radius: 12px;
    padding: 28px; width: 100%; max-width: 420px;
  }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  p.sub { color: #9999b0; font-size: 0.85rem; margin: 0 0 20px; }
  label { display: block; font-size: 0.85rem; margin: 14px 0 6px; color: #c5c5d5; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 12px;
    background: #0d0d16; border: 1px solid #2a2a3a; border-radius: 8px;
    color: #e5e5f0; font-family: monospace; font-size: 0.85rem;
  }
  button {
    margin-top: 20px; width: 100%; padding: 11px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white; border: none; border-radius: 8px; font-weight: 600;
    cursor: pointer; font-size: 0.9rem;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; padding: 10px; border-radius: 8px; display: none; }
  .status--ok { background: rgba(34,197,94,0.15); color: #4ade80; display: block; }
  .status--err { background: rgba(239,68,68,0.15); color: #f87171; display: block; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔑 OMICRON Backend Admin</h1>
    <p class="sub">Swap the active OpenRouter key instantly — no redeploy needed.</p>

    <label for="adminToken">Admin Token</label>
    <input type="password" id="adminToken" placeholder="Your ADMIN_TOKEN" autocomplete="off" />

    <label for="apiKey">New OpenRouter API Key</label>
    <input type="password" id="apiKey" placeholder="sk-or-v1-..." autocomplete="off" />

    <button id="updateBtn">Update Key</button>
    <button id="checkBtn" style="background:#2a2a3a; margin-top:8px;">Check Current Status</button>

    <div id="status" class="status"></div>
  </div>

  <script>
    const statusEl  = document.getElementById("status");
    const tokenEl   = document.getElementById("adminToken");
    const keyEl     = document.getElementById("apiKey");

    function showStatus(msg, ok) {
      statusEl.textContent = msg;
      statusEl.className = "status " + (ok ? "status--ok" : "status--err");
    }

    document.getElementById("updateBtn").addEventListener("click", async () => {
      const token = tokenEl.value.trim();
      const key   = keyEl.value.trim();
      if (!token || !key) { showStatus("Enter both fields.", false); return; }

      try {
        const res = await fetch("/api/admin/set-key", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Token": token },
          body: JSON.stringify({ apiKey: key }),
        });
        const data = await res.json();
        if (!res.ok) { showStatus(data.error || "Failed to update.", false); return; }
        showStatus(`✅ Key updated: ${data.maskedKey}`, true);
        keyEl.value = "";
      } catch (e) {
        showStatus("Couldn't reach the server. Check your connection.", false);
      }
    });

    document.getElementById("checkBtn").addEventListener("click", async () => {
      const token = tokenEl.value.trim();
      if (!token) { showStatus("Enter your admin token first.", false); return; }

      try {
        const res = await fetch("/api/admin/status", {
          headers: { "X-Admin-Token": token },
        });
        const data = await res.json();
        if (!res.ok) { showStatus(data.error || "Failed to check.", false); return; }
        showStatus(data.hasKey ? `Active key: ${data.maskedKey}` : "No key currently set.", data.hasKey);
      } catch (e) {
        showStatus("Couldn't reach the server. Check your connection.", false);
      }
    });
  </script>
</body>
</html>
